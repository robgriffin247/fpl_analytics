version: 2

models:
  - name: obt_player_gameweek_stats
    description: Table containing player statistics for each gameweek during the season. One row per player and gameweek. Production table includes details on upcoming fixtures including opponents and form.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - gameweek
  - name: fct_fixtures
    description: Fixture list table.
  - name: fct_standings
    description: League table.