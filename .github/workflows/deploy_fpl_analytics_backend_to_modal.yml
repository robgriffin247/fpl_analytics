name: Deploy FPL Analytics Backend to Modal

on:
  push:
    branches:
      - main
    paths:
      - 'modal/fpl_analytics_backend.py'
      - 'extract_load/**'
      - 'transform/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy_fpl_analytics_backend_to_modal.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python
        run: uv python install
      
      - name: Install dependencies
        run: uv sync
      
      - name: Check Formatting
        run: uv run black --check modal/fpl_analytics_backend.py extract_load/ transform/
    
    # TODO: add testing to CI

  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
    
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Set up Python
        run: uv python install
        
      - name: Install dependencies
        run: uv sync
        
      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv run modal deploy modal/fpl_analytics_backend.py